name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the node:22-alpine base image the container ships on.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          # Browsers are installed explicitly below, and only the one we use.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Lint
        run: npm run lint

      - name: Typecheck app
        run: npm run typecheck

      - name: Typecheck e2e specs
        run: npm run typecheck:e2e

      - name: Unit tests
        run: npm test

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        # Both Playwright projects (default and forced-colors) use Chromium,
        # so Firefox and WebKit are not worth the download here.
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        # playwright.config.ts starts its own server and blanks the vendor API
        # keys, so a CI run can never reach MailerLite or send mail.
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Production build
        run: npm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build only — publishing happens in release.yml. This just proves the
      # Dockerfile still works before a tag depends on it.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: sfrlf-formsite:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
