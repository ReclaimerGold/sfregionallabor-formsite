name: Release

# Publishes a container image to GitHub Container Registry for Portainer.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Produces ghcr.io/<owner>/<repo> tagged with the semver (v0.1.0, 0.1, 0),
# the commit sha, and `latest`.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra tag to publish (e.g. staging)"
        required: false
        default: ""

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A release must not ship code that hasn't passed the suite, so the publish
  # job below waits on this one.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run typecheck:e2e
      - run: npm test

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  publish:
    name: Build and push image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      # Required for GITHUB_TOKEN to push to ghcr.io.
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          # metadata-action lowercases the image name for us. GHCR rejects
          # uppercase, and github.repository preserves the owner's casing.
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
          labels: |
            org.opencontainers.image.title=SFRLF Get Involved form
            org.opencontainers.image.description=Sign-up form for the Sioux Falls Regional Labor Federation

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # amd64 only: the deployment host is x86_64 and emulated arm64 builds
          # of Next.js are extremely slow. Add linux/arm64 here if that changes.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Image published"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "If Portainer cannot pull it, the package is still private —"
            echo "make it public under Packages → Package settings, or add a"
            echo "ghcr.io registry in Portainer with a read:packages token."
          } >> "$GITHUB_STEP_SUMMARY"
